version: 2
updates:
  # Runtime and test dependencies declared in pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # Pinned action SHAs in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # examples/demo-function is deliberately left out: its vulnerable
  # requests pin is the point of the demo.
