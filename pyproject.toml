[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-tools"
version = "0.1.0"
description = "Back up, scan, remediate, and package AWS Lambda functions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "packaging>=23.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
test = [
    "moto>=5.0",
    "pytest>=8.0",
]

[project.scripts]
lambda-tools = "lambdatools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs real AWS credentials or network"]
addopts = "-m 'not integration'"
