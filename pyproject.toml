[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-tools"
version = "0.1.0"
description = "Back up, scan, remediate, and package AWS Lambda functions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.127",
    "botocore>=1.43.127",
    "packaging>=26.3",
    "truststore>=0.10.5",
]

[project.optional-dependencies]
test = [
    "moto>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
lambda-tools = "lambdatools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs real AWS credentials or network"]
addopts = "-m 'not integration'"
